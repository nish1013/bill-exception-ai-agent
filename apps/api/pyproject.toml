[project]
name = "bill-exception-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.1,<5.2",
    "celery>=5.4,<5.5",
    "psycopg[binary]>=3.2,<4",
    "redis>=5,<6",
    "uvicorn>=0.32,<1",
    "graphene-django>=3.2,<4",
    "pyjwt[crypto]>=2.9,<3",
    "channels>=4.2,<5",
    "channels-redis>=4.2,<5",
    "websockets>=13,<16",
    "openai>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-django>=4.9,<5",
    "ruff>=0.8,<1",
    "import-linter>=2.1,<3",
    "pytest-xdist>=3.6,<4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
# One process per CPU. Each gets its own test database and broker vhost. A chunk of one test
# keeps the slow broker tests on different workers.
addopts = "-n auto --maxschedchunk 1"
markers = ["openai: a live call to the OpenAI API, skipped when OPENAI_API_KEY is not set"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.importlinter]
root_packages = ["payables"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain imports no adapters, entrypoints or Django"
type = "forbidden"
source_modules = ["payables.domain"]
forbidden_modules = ["payables.adapters", "payables.entrypoints", "django"]
