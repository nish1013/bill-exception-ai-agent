x-app-env: &app-env
  DJANGO_SECRET_KEY: dev-only-not-secret
  DJANGO_DEBUG: "1"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
  POSTGRES_HOST: postgres
  POSTGRES_DB: payables
  POSTGRES_USER: payables
  POSTGRES_PASSWORD: payables
  POSTGRES_APP_USER: payables_app
  POSTGRES_APP_PASSWORD: payables_app
  POSTGRES_RELAY_USER: payables_relay
  POSTGRES_RELAY_PASSWORD: payables_relay
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: amqp://payables:payables@rabbitmq:5672//
  # The browser signs in at localhost. The API fetches the keys inside the Compose network.
  OIDC_ISSUER: http://localhost:${OIDC_PORT:-8080}/payables
  OIDC_JWKS_URL: http://oidc:8080/payables/jwks
  OIDC_AUDIENCE: payables-api

x-app: &app
  build: ./apps/api
  environment: *app-env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payables
      POSTGRES_USER: payables
      POSTGRES_PASSWORD: payables
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payables -d payables"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: payables
      RABBITMQ_DEFAULT_PASS: payables
    ports:
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # ping answers before the AMQP listener is up. The relay and workers need the listener.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30

  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      JSON_CONFIG_PATH: /oidc/config.json
    ports:
      - "${OIDC_PORT:-8080}:8080"
    volumes:
      - ./dev/oidc:/oidc:ro
    healthcheck:
      # The image has no shell and no curl. Java runs the one-file check from source.
      test: ["CMD", "java", "/oidc/Healthcheck.java"]
      interval: 3s
      timeout: 10s
      retries: 30

  api:
    <<: *app
    environment:
      <<: *app-env
      # Only the API and the apply worker hold the callback secret (D23).
      ACCOUNTING_CALLBACK_SECRET: dev-only-callback-secret
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 30

  relay:
    <<: *app
    command: ["python", "manage.py", "run_relay"]

  worker-checks:
    <<: *app
    command: ["celery", "-A", "config", "worker", "-Q", "checks", "-c", "4", "-n", "checks@%h"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d checks@$$HOSTNAME"]
      interval: 10s
      timeout: 10s
      retries: 12

  worker-propose-ai:
    <<: *app
    environment:
      <<: *app-env
      LLM_PROVIDER: stub
    command: ["celery", "-A", "config", "worker", "-Q", "propose-ai", "-c", "2", "-n", "propose-ai@%h"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d propose-ai@$$HOSTNAME"]
      interval: 10s
      timeout: 10s
      retries: 12

  worker-apply:
    <<: *app
    environment:
      <<: *app-env
      ACCOUNTING_STUB_MODE: ${ACCOUNTING_STUB_MODE:-ok}
      ACCOUNTING_CALLBACK_URL: http://api:8000/callbacks/accounting/stub
      ACCOUNTING_CALLBACK_SECRET: dev-only-callback-secret
      APPLY_FIRST_RETRY_SECONDS: ${APPLY_FIRST_RETRY_SECONDS:-10}
    command: ["celery", "-A", "config", "worker", "-Q", "apply", "-c", "2", "-n", "apply@%h"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d apply@$$HOSTNAME"]
      interval: 10s
      timeout: 10s
      retries: 12

  worker-reports:
    <<: *app
    command: ["celery", "-A", "config", "worker", "-Q", "reports", "-c", "1", "-n", "reports@%h"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d reports@$$HOSTNAME"]
      interval: 10s
      timeout: 10s
      retries: 12

  web:
    build:
      context: ./web
      args:
        VITE_OIDC_AUTHORITY: http://localhost:${OIDC_PORT:-8080}/payables
        VITE_OIDC_CLIENT_ID: payables-console
    # No app environment: the console container holds no database, broker or signing secret.
    environment:
      API_UPSTREAM: api:8000
      OIDC_ORIGIN: http://localhost:${OIDC_PORT:-8080}
    ports:
      - "${WEB_PORT:-3000}:8080"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api:
        condition: service_healthy
      oidc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  rabbitmq-data:
